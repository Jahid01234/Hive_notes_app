name: hive_notes_app
description: "Notes App Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  google_fonts: ^8.1.0
  hive: ^2.2.3
  flutter_spinkit: ^5.2.2
  intl: ^0.20.3
  flutter_screenutil: ^5.9.3
  hive_flutter: ^1.1.0
  share_plus: ^12.0.2
  flutter_slidable: ^4.0.3
  fluttertoast: ^9.0.0
  uuid: ^4.6.0
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
  flutter_launcher_icons: "^0.14.4"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icons/app_primary_icon.png"
  min_sdk_android: 21


flutter:

  uses-material-design: true

  assets:
    - assets/icons/


